apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-gcp-serving
  namespace: fraud-serving
spec:
  ingressClassName: nginx
  rules:
  - host: fraud.example.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraud-gcp-serving
            port:
              number: 9091

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-gcp-serving
  namespace: fraud-serving
spec:
  ingressClassName: nginx
  rules:
  - host: ''
    http:
      paths:
      - backend:
          service:
            name: fraud-gcp-serving
            port:
              number: 9091
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - ''
    secretName: fraud-gcp-serving-tls

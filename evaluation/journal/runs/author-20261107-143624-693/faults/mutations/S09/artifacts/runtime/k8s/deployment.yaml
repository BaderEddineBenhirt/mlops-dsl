apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-c00-serving
  namespace: vision-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: validation-c00-serving
  template:
    metadata:
      labels:
        app: validation-c00-serving
    spec:
      containers:
      - image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
        name: serving
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080

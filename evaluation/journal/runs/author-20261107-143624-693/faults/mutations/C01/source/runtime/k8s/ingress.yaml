apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: vision-serving
  name: validation-c00-serving
spec:
  ingressClassName: nginx
  rules:
  - host: vision.azure.company.com
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            port:
              number: 80
            name: validation-c00-serving

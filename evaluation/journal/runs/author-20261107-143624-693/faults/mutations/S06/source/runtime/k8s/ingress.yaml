apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: vision-serving
  name: validation-c00-serving
spec:
  ingressClassName: nginx
  tls:
  - secretName: validation-c00-serving-tls
    hosts:
    - placeholder.invalid
  rules:
  - host: ''
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            port:
              number: 80
            name: validation-c00-serving

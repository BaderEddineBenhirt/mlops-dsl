apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: validation-c00-serving
  namespace: vision-serving
spec:
  ingressClassName: nginx
  rules:
  - host: ''
    http:
      paths:
      - backend:
          service:
            name: validation-c00-serving
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - ''
    secretName: validation-c00-serving-tls

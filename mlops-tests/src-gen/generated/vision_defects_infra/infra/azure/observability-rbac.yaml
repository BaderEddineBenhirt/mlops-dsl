apiVersion: v1
kind: ServiceAccount
metadata:
  name: obs-agent-sa
  namespace: vision-serving
  annotations:
    azure.workload.identity/client-id: "<FILL_ME_AZURE_MI_CLIENT_ID>"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obs-agent-readonly
  labels:
    app: obs-agent
rules:
  -
    apiGroups:
      - ""
      - apps
      - batch
    resources:
      - pods
      - pods/log
      - nodes
      - nodes/proxy
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obs-agent-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obs-agent-readonly
subjects:
  -
    kind: ServiceAccount
    name: obs-agent-sa
    namespace: vision-serving

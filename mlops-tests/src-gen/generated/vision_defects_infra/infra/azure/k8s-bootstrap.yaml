apiVersion: v1
kind: Namespace
metadata:
  name: vision-serving
  labels:
    costCenter: vision_defects_infra
    budgetLimitUsdMonthly: "3000"
    piiData: "true"
    gdprRestricted: "true"
    complianceLevel: STRICT
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-guard
  namespace: vision-serving
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    -
      to:
        -
          namespaceSelector:
            matchLabels:
              observability-stack: datadog
      ports:
        -
          protocol: TCP
          port: 443

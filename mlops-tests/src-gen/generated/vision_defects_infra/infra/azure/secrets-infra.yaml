kind: secrets-infra
backend:
  type: VAULT
  pathPrefix: kv/vision-prod/
  azure:
    keyVaultName: kv-vision-serving
    resourceGroup: vision-serving-rg
    managedIdentityClientId: "<FILL_ME_AZURE_MI_CLIENT_ID>"
workloadDelivery:
  strategy: csi/sidecar
  complianceLevel: STRICT
  note: "Workloads must have readonly access to kv/vision-prod/* under this compliance level."
  accountId: azure-subscription-1234
  region: westeurope

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-defects-s03-public-without-tls-v2-serving
  namespace: vision-serving
spec:
  replicas: 2
  selector:
    matchLabels: { app: vision-defects-s03-public-without-tls-v2-serving }
  template:
    metadata:
      labels: { app: vision-defects-s03-public-without-tls-v2-serving }
    spec:
      containers:
        - name: serving
          image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: "/ready", port: 8080 }
          livenessProbe:
            httpGet: { path: "/health", port: 8080 }
